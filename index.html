<div id="moviePopup"
     class="hidden fixed inset-0  z-50 bg-black/60 flex items-center justify-center p-4">
  <div
  role="dialog"
  aria-modal="true"
  aria-labelledby="popupTitle"

        alt="">

        <div class="flex-1 min-w-0">

        </div>

    </div>
  </div>
