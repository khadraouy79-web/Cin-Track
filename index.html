</head>

<header class="sticky justify-center flex-col ">

<section class="navigationAll flex flex-col md:flex-row items-center justify-between gap-4 p-4">

<div>
  <nav class="navigation ">
    <ul class = "menu  flex flex-wrap justify-center items-center gap-3">

        <li><a id="Home" href="#" class="text-white font-[Monoton] transition-all duration-300 ease-in-out hover:text-[#e70634] active text-lg sm:text-2xl">Home</a></li>
        <li><a id="series" href="#" class="text-white font-[Monoton] transition-all duration-300 ease-in-out hover:text-[#e70634] text-lg sm:text-2xl">Series</a></li>
        <li><a id="Movies" href="#" class="text-white font-[Monoton] transition-all duration-300 ease-in-out hover:text-[#e70634] text-lg sm:text-2xl">Movies</a></li>
    </ul>
  </nav>

</div>
      <input type="search" id="searshBar" class="w-full md:w-72 lg:w-[400px] mt-[10px] bg-transparent placeholder:text-slate-400 text-white text-sm border border-white rounded-md pl-10 pr-3 py-2 transition duration-300 ease focus:outline-none focus:border-slate-400 hover:border-slate-300 shadow-sm focus:shadow " placeholder=" searsh... ">

</section>

<h1 class="logo " >
  <img src="img/Logo.png" class="max-w-full h-auto mx-auto" alt="CinéTrack">
</h1>


</header>

<main >

<div>
<div>
<div class="flex flex-col lg:flex-row items-start gap-6 p-4 sm:p-6">
<section
  id="cardsContainer"
  class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-6 w-full min-w-0 flex-1">
</section>

<aside class ="bg-black w-full lg:w-[280px] shrink-0 rounded-xl opacity-65 lg:sticky lg:top-4 lg:max-h-[calc(100vh-2rem)] lg:overflow-y-auto">
  <h2 class ="text-white ml-[20px] p-4 text-xl font-bold">favorite shows ❤️</h2>
  <div id="favoriteCard" class="grid col-span-1 gap-2 p-2">
  </div>
</aside>

</div>
</div>


<div id="moviePopup"
     class="hidden fixed inset-0  z-50 bg-black/60 flex items-center justify-center p-4">
  <div
  role="dialog"
  aria-modal="true"
  aria-labelledby="popupTitle"
  class="relative bg-neutral-900 text-white rounded-xl p-6 w-full max-w-2xl max-h-[85vh] overflow-y-auto">
<button id="closePopup"
        aria-label="Fermer"
        class="absolute top-2 right-3 text-2xl  hover:text-red-500">X
      </button>
      <div class="flex flex-col sm:flex-row gap-5">
        <img id="popupImage"
        class="w-32 h-48 object-cover rounded-lg shrink-0 self-start"
        alt="">

        <div class="flex-1 min-w-0">
          <h2 id="popupTitle" class="text-2xl font-bold mb-4 pr-5"></h2>
          <div id="popupInfo" class="space-y-2 text-gray-300"></div>
        </div>

    </div>
  </div>
</div>





 <nav class="pagination flex justify-center gap-4">

      <button id="prevBtn" class="btn1  bg-red-600 p-2 text-xl font-bold rounded-xl  hover:bg-red-800 " > prev </button>
      
      <span id="page-numbers" class="bg-red-600 p-2 text-xl font-bold rounded-xl  hover:bg-red-800"></span>
      <button id="nextBtn" class="btn2 bg-red-600 p-2 text-xl font-bold rounded-xl  hover:bg-red-800">next  </button>
      

    
   
  </nav>

</main>
